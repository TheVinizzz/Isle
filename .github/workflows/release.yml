name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install dependencies
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        run: |
          xcodebuild \
            -project Isle.xcodeproj \
            -scheme Isle \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/Isle.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create \
            -volname "Isle" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "dist/Isle-${VERSION}.dmg"
          rm -rf "$STAGE"
          echo "DMG_PATH=dist/Isle-${VERSION}.dmg" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          name: Isle ${{ env.VERSION }}
          body: |
            Isle ${{ env.VERSION }} — turn your MacBook notch into an interactive island.

            ## Install
            1. Download `Isle-${{ env.VERSION }}.dmg`
            2. Open it, drag **Isle** into Applications
            3. First launch: right-click `Isle.app` → **Open** (Gatekeeper bypass — the build is ad-hoc signed, not notarized)
            4. Grant permissions when prompted (Calendar, Automation for Spotify / Music)

            ## Notes
            Requires macOS 14.0 or newer on an Apple Silicon MacBook with a notch.
          draft: false
          prerelease: false

      - name: Upload artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Isle-${{ env.VERSION }}-dmg
          path: ${{ env.DMG_PATH }}
