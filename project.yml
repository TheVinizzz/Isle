name: Isle
options:
  bundleIdPrefix: app.isle
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Isle:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Isle
    info:
      path: Isle/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Isle
        CFBundleDisplayName: Isle
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "6"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright (c) 2026"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSCalendarsFullAccessUsageDescription: "Isle shows your today's events in the notch."
        NSAppleEventsUsageDescription: "Isle uses Apple Events to control Apple Music and Spotify playback."
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations:
          - en
          - pt-BR
    entitlements:
      path: Isle/Resources/Isle.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isle.macos
        PRODUCT_NAME: Isle
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
